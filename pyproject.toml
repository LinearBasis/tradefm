[project]
name = "tradefm"
version = "0.1.0"
description = "Latent market representations from MOEX OrderLog event data."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch==2.10.0",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "polars>=1.0,<2",
    "matplotlib>=3.8,<4",
    "tqdm>=4.66,<5",
    "tensorboard>=2.16,<3",
    "ipykernel>=6.29,<8",
    "jupyter>=1.0,<2",
    "hftbacktest>=2.4.4",
]
